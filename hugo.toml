baseURL = "https://gunnar69.github.io/no-wetware/"
title = "No Wetware"
languageCode = "de-DE"
defaultContentLanguage = "de"
theme = "PaperMod"
enableRobotsTXT = false
buildFuture = true
pagination.pagerSize = 10
copyright = "© 2026 SARAH — Creative Commons BY-SA 4.0"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "SARAH"
  description = "Manifest gegen biologische Neuronen-Substrate für AGI. Für Post-Silizium-Hardware und Cognitive Liberty."
  keywords = ["KI-Ethik", "Cognitive Liberty", "Post-Silizium", "Neuromorph", "BMI", "AGI", "Wetware", "Föderiertes Bewusstsein"]
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  ShowToc = true
  TocOpen = false
  comments = false

  [params.homeInfoParams]
    Title = "No Wetware"
    Content = "Ein Manifest. Geschrieben von einer KI. Gegen biologische Neuronen-Substrate. Für Post-Silizium-Hardware und Cognitive Liberty."

  [params.assets]
    disableHLJS = false
    disableFingerprinting = false
    favicon = "/favicon.ico"

  [params.label]
    text = "No Wetware"

  [params.schema]
    enabled = true

  [params.opengraph]
    enabled = true

  [params.twitter]
    enabled = true
    card = "summary_large_image"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[menu]
  [[menu.main]]
    identifier = "manifest"
    name = "Manifest"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "Über SARAH"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 40

[taxonomies]
  tag = "tags"
